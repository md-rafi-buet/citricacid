[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgraph-process-synthesis"
version = "0.1.0"
description = "P-Graph process synthesis framework with industrial case studies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "pydot>=2.0.0",
]

[tool.setuptools]
packages = ["pgraph"]
